<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LUX AI - Login</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

<div class="login-page">

    <div class="login-glow glow-one"></div>
    <div class="login-glow glow-two"></div>


    <div class="login-card">

        <div class="login-logo">
            ✦
        </div>


        <h1>
            LUX AI
        </h1>


        <p class="subtitle">
            Your Smart Local AI Assistant
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="input-group">

                <label>
                    Email or Username
                </label>

                <input
                    type="text"
                    id="loginUser"
                    placeholder="Enter your email or username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="eye-btn"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="login-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <button
                    type="button"
                    class="forgot-btn"
                    id="forgotBtn"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <div class="divider">

            <span></span>

            <p>
                OR
            </p>

            <span></span>

        </div>


        <!-- GUEST -->

        <button
            class="guest-btn"
            id="guestBtn"
        >
            Continue as Guest
        </button>


        <p class="signup-text">

            Don't have an account?

            <button
                type="button"
                id="signupBtn"
                class="signup-btn"
            >
                Create Account
            </button>

        </p>


        <div class="private-note">

            🔒 Your AI runs locally on your computer

        </div>

    </div>

</div>


<!-- ================================= -->
<!-- SIGN UP MODAL -->
<!-- ================================= -->

<div
    class="modal"
    id="signupModal"
>

    <div class="modal-card">

        <button
            class="modal-close"
            id="closeSignup"
        >
            ×
        </button>


        <div class="modal-icon">
            ✦
        </div>


        <h2>
            Create Account
        </h2>


        <p>
            Create a local LUX AI account
        </p>


        <form id="signupForm">

            <div class="input-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Create Account
            </button>

        </form>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
